<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="1000" height="480" role="img" aria-label="Experience: undergraduate research student at MacAI (now), and previously an intern at Ampliphi."><title>Experience: undergraduate research student at MacAI (now), and previously an intern at Ampliphi.</title><desc>Experience: undergraduate research student at MacAI (now), and previously an intern at Ampliphi.</desc><style>.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono','DejaVu Sans Mono',monospace}.s{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}.b{font-weight:700}</style><defs></defs><rect x=".5" y=".5" width="999" height="479" rx="12" fill="#0d1117" stroke="#30363d"/><rect x="1" y="1" width="998" height="34" rx="11" fill="#161b22"/><rect x="1" y="22" width="998" height="13" fill="#161b22"/><line x1="1" y1="35" x2="999" y2="35" stroke="#30363d"/><text class="m" x="22" y="24" font-size="13" fill="#8b949e">git log --author=avneet --oneline</text><line x1="48" y1="94" x2="48" y2="450" stroke="#30363d" stroke-width="2" stroke-dasharray="4 5"><animate attributeName="stroke-dashoffset" from="0" to="-18" dur="1.2s" repeatCount="indefinite"/></line><circle cx="48" cy="94" r="7" fill="#E0457B" opacity=".35"><animate attributeName="r" values="7;18.2;7" dur="2.2s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values=".45;0;.45" dur="2.2s" begin="0s" repeatCount="indefinite"/></circle><circle cx="48" cy="94" r="7" fill="#E0457B"/><circle cx="48" cy="294" r="7" fill="#0d1117" stroke="#FDBF57" stroke-width="3"/><g><animate attributeName="opacity" dur="0.7s" fill="freeze" values="0;0;1" keyTimes="0;0.29;1" /><animateTransform attributeName="transform" type="translate" dur="0.7s" fill="freeze" values="0 14;0 14;0 0" keyTimes="0;0.29;1" /><rect x="96" y="64" width="864" height="178" rx="10" fill="#161b22" stroke="#30363d"/><rect x="96" y="64" width="4" height="178" rx="2" fill="#E0457B"/><text class="s b" x="120" y="98" font-size="21" fill="#e6edf3">Undergraduate Research Student</text><text class="m" x="482.0" y="98" font-size="15" fill="#E0457B">@ MacAI</text><rect x="899" y="80" width="43" height="22" rx="11" fill="none" stroke="#E0457B" stroke-opacity=".7"/><text class="m" x="920.5" y="95" font-size="11.5" fill="#E0457B" text-anchor="middle">now</text><text class="m" x="120" y="130" font-size="15.5" fill="#E0457B">&gt;</text><text class="m" x="138.6" y="130" font-size="15.5" fill="#c9d1d9" textLength="669.6" lengthAdjust="spacing" xml:space="preserve">NLP perspectivism: prompting LLMs to predict one annotator's labels from</text><text class="m" x="138.6" y="152" font-size="15.5" fill="#c9d1d9" textLength="297.6" lengthAdjust="spacing" xml:space="preserve">their personal labelling history</text><text class="m" x="120" y="180" font-size="15.5" fill="#E0457B">&gt;</text><text class="m" x="138.6" y="180" font-size="15.5" fill="#c9d1d9" textLength="604.5" lengthAdjust="spacing" xml:space="preserve">Optimizing the prompts themselves; the method is the contribution</text><text class="m" x="120" y="208" font-size="15.5" fill="#E0457B">&gt;</text><text class="m" x="138.6" y="208" font-size="15.5" fill="#c9d1d9" textLength="725.4" lengthAdjust="spacing" xml:space="preserve">Aiming to present at CUCAI (Canadian Undergraduate Conference on AI), Mar 2027</text></g><g><animate attributeName="opacity" dur="1.4s" fill="freeze" values="0;0;1" keyTimes="0;0.64;1" /><animateTransform attributeName="transform" type="translate" dur="1.4s" fill="freeze" values="0 14;0 14;0 0" keyTimes="0;0.64;1" /><rect x="96" y="264" width="864" height="200" rx="10" fill="#161b22" stroke="#30363d"/><rect x="96" y="264" width="4" height="200" rx="2" fill="#FDBF57"/><text class="s b" x="120" y="298" font-size="21" fill="#e6edf3">Intern</text><text class="m" x="203.6" y="298" font-size="15" fill="#FDBF57">@ Ampliphi</text><rect x="864" y="280" width="78" height="22" rx="11" fill="none" stroke="#FDBF57" stroke-opacity=".7"/><text class="m" x="903.0" y="295" font-size="11.5" fill="#FDBF57" text-anchor="middle">previous</text><text class="m" x="120" y="330" font-size="15.5" fill="#FDBF57">&gt;</text><text class="m" x="138.6" y="330" font-size="15.5" fill="#c9d1d9" textLength="688.2" lengthAdjust="spacing" xml:space="preserve">Core contributor to a market-aware hotel pricing model: +4.2% ADR vs +1.7%</text><text class="m" x="138.6" y="352" font-size="15.5" fill="#c9d1d9" textLength="390.6" lengthAdjust="spacing" xml:space="preserve">for the prior model in a 56-hotel backtest</text><text class="m" x="120" y="380" font-size="15.5" fill="#FDBF57">&gt;</text><text class="m" x="138.6" y="380" font-size="15.5" fill="#c9d1d9" textLength="660.3" lengthAdjust="spacing" xml:space="preserve">Cut competitor-data load on the pricing calendar ~30x (45s to ~1.5s) by</text><text class="m" x="138.6" y="402" font-size="15.5" fill="#c9d1d9" textLength="511.5" lengthAdjust="spacing" xml:space="preserve">batching 30+ per-competitor API calls into one endpoint</text><text class="m" x="120" y="430" font-size="15.5" fill="#FDBF57">&gt;</text><text class="m" x="138.6" y="430" font-size="15.5" fill="#c9d1d9" textLength="762.6" lengthAdjust="spacing" xml:space="preserve">Enabled 50,000+ row CSV uploads without timeouts via an async S3 + worker pipeline</text></g></svg>